name: Actualiser les annonces et publier

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Récupérer les annonces publiques
        run: node scripts/update-announcements.mjs
      - name: Préparer uniquement les fichiers du site
        run: |
          mkdir _site
          cp index.html style.css logo.png CNAME .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site 3DS
        id: deployment
        uses: actions/deploy-pages@v4
